<div class="row justify-content-center">
    <div class="col-lg-7 col-md-9"> <div class="card shadow-lg border-0">
            
            <div class="card-header bg-primary text-white">
                <h2 class="h4 mb-0">
                    <i class="bi bi-tag-fill me-2"></i> 
                    {{ engine.idEngine > 0 ? "Actualizar Motor" : "Crear Motor" }}
                </h2>
            </div>
            
            <form (ngSubmit)="onSubmit(engineForm)" #engineForm="ngForm">
                <div class="card-body p-4">
                    
                    <input type="hidden" name="idEngine" [(ngModel)]="engine.idEngine" />

                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Nombre del Motor <span class="text-danger">*</span></label>
                        <input
                            required
                            #name="ngModel"
                            name="name"
                            [(ngModel)]="engine.name"
                            type="text"
                            class="form-control"
                        />
                        <div *ngIf="name.invalid && (name.dirty || name.touched)" class="text-danger mt-1 small">
                            El nombre del motor es obligatorio.
                        </div>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-end">
                        
                        <a [routerLink]="['/engines']" class="btn btn-outline-secondary me-2">
                            <i class="bi bi-arrow-left"></i> Regresar
                        </a>
                        
                        <button 
                            type="submit" 
                            class="btn btn-success" 
                            [disabled]="engineForm.invalid"
                        >
                            <i class="bi bi-save-fill me-1"></i> 
                            {{ engine.idEngine > 0 ? 'Guardar Cambios' : 'Crear Motor' }} 
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>
