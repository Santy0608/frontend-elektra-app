<!-- Fila 1: Top Parts + Critical Stock -->
<div class="dashboard-grid">

  <div class="chart-card">
    <h3>🔧 Top 5 Repuestos Más Vendidos</h3>
    <canvas id="topPartsChart"></canvas>
  </div>

  <div class="chart-card">
    <h3>⚠️ Repuestos con Stock Crítico</h3>
    <canvas id="criticalStockChart"></canvas>
  </div>

  <!-- Fila 2: Top Customers + Parts by Category -->
  <div class="chart-card">
    <h3>🏆 Top 5 Mejores Clientes</h3>
    <canvas id="topCustomersChart"></canvas>
  </div>

  <div class="chart-card">
    <h3>🗂️ Repuestos por Categoría</h3>
    <canvas id="partsByCategoryChart"></canvas>
  </div>

  <!-- Fila 3: Ventas Mensuales (ancho completo) -->
  <div class="chart-card full-width">
    <h3>📈 Ventas Mensuales {{ currentYear }}</h3>
    <canvas id="monthlySalesChart"></canvas>
  </div>

</div>
