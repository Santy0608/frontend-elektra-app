<div class="row justify-content-center">
    <div class="col-lg-7 col-md-9"> <div class="card shadow-lg border-0">
            
            <div class="card-header bg-primary text-white">
                <h2 class="h4 mb-0">
                    <i class="bi bi-tag-fill me-2"></i> 
                    {{ email.idEmail > 0 ? "Actualizar Correo" : "Crear Correo" }}
                </h2>
            </div>
            
            <form (ngSubmit)="onSubmit(emailForm)" #emailForm="ngForm">
                <div class="card-body p-4">
                    
                    <input type="hidden" name="idEmail" [(ngModel)]="email.idEmail" />

                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Correo Electrónico <span class="text-danger">*</span></label>
                        <input
                            placeholder="Ej: shago@gmail.com"
                            required
                            #email="ngModel"
                            name="email"
                            [(ngModel)]="email.email"
                            type="text"
                            class="form-control"
                        />
                        <div *ngIf="email.invalid && (email.dirty || email.touched)" class="text-danger mt-1 small">
                            El correo electrónico es obligatorio.
                        </div>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-end">
                        
                        <a [routerLink]="['/emails']" class="btn btn-outline-secondary me-2">
                            <i class="bi bi-arrow-left"></i> Regresar
                        </a>
                        
                        <button 
                            type="submit" 
                            class="btn btn-success" 
                            [disabled]="emailForm.invalid"
                        >
                            <i class="bi bi-save-fill me-1"></i> 
                            {{ email.idEmail > 0 ? 'Guardar Cambios' : 'Crear Correo' }} 
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>
