<div class="row justify-content-center">
    <div class="col-lg-7 col-md-9"> <div class="card shadow-lg border-0">
            
            <div class="card-header bg-primary text-white">
                <h2 class="h4 mb-0">
                    <i class="bi bi-tag-fill me-2"></i> 
                    {{ phone.idPhone > 0 ? "Actualizar Teléfono" : "Crear Teléfono" }}
                </h2>
            </div>
            
            <form (ngSubmit)="onSubmit(phoneForm)" #phoneForm="ngForm">
                <div class="card-body p-4">
                    
                    <input type="hidden" name="idPhone" [(ngModel)]="phone.idPhone" />

                    <div class="mb-3">
                        <label for="phoneNumber" class="form-label fw-bold">Número de Teléfono <span class="text-danger">*</span></label>
                        <input
                            placeholder="Ej: 2222-2222"
                            required
                            #phoneNumber="ngModel"
                            name="phoneNumber"
                            [(ngModel)]="phone.phoneNumber"
                            type="text"
                            class="form-control"
                        />
                        <div *ngIf="phoneNumber.invalid && (phoneNumber.dirty || phoneNumber.touched)" class="text-danger mt-1 small">
                            El número de teléfono es obligatorio.
                        </div>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-end">
                        
                        <a [routerLink]="['/phones']" class="btn btn-outline-secondary me-2">
                            <i class="bi bi-arrow-left"></i> Regresar
                        </a>
                        
                        <button 
                            type="submit" 
                            class="btn btn-success" 
                            [disabled]="phoneForm.invalid"
                        >
                            <i class="bi bi-save-fill me-1"></i> 
                            {{ phone.idPhone > 0 ? 'Guardar Cambios' : 'Crear Teléfono' }} 
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>
